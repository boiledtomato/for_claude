name: NotebookLM Docs Weekly Update

on:
  schedule:
    # 毎週月曜 11:30 JST (月曜 02:30 UTC)
    # 00:00 UTC は daily-update.yml と zscaler-monitor.yml も起動する時刻で、
    # 3つが同時に main へ push して取りこぼしが出ていたため後ろへずらしている。
    - cron: "30 2 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "incremental = 変更分のみ / full = 全記事を再取得"
        type: choice
        options: [incremental, full]
        default: incremental
      categories:
        description: "対象カテゴリ（空欄で全て。例: zia zpa api）"
        type: string
        default: ""
      sync:
        description: "NotebookLM への同期"
        type: choice
        options: [enabled, dry-run, skip]
        default: enabled

permissions:
  contents: write

concurrency:
  group: notebooklm-docs
  cancel-in-progress: false

jobs:
  update-docs:
    runs-on: ubuntu-latest
    # 差分更新は通常数分。mode=full の全4,200記事再取得は2時間前後かかる。
    timeout-minutes: 330

    # secrets は if: 条件で直接参照できないので、job の env に持ち上げて判定する
    env:
      NOTEBOOKLM_STORAGE_STATE_JSON: ${{ secrets.NOTEBOOKLM_STORAGE_STATE_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Build / update docs
        # inputs は env 経由で渡す（run: に直接展開するとシェルに解釈されてしまう）
        env:
          MODE: ${{ inputs.mode }}
          CATEGORIES: ${{ inputs.categories }}
        run: |
          set --
          if [ "$MODE" = "full" ]; then
            set -- --full
          fi
          if [ -n "$CATEGORIES" ]; then
            # 空白区切りのカテゴリ名を個別の引数に展開する
            set -- "$@" --categories $CATEGORIES
          fi
          python scripts/build_help_docs.py "$@"

      - name: Commit updated docs
        run: |
          # push が弾かれるのは、同時刻に走る他のワークフローが先に main を進めた
          # ときで、単に再試行しても永久に通らない。origin/main に rebase してから
          # 試し、4回とも駄目ならステップを失敗させる（握り潰すとコミットが黙って
          # 失われ、次回の同期が全ファイル再アップロードになる）。
          push_with_retry() {
            for i in 1 2 3 4; do
              if git push origin HEAD; then
                return 0
              fi
              echo "push rejected (attempt $i) — rebasing onto origin/main"
              sleep $((2 ** i))
              git fetch origin main || continue
              git rebase origin/main || { git rebase --abort || true; continue; }
            done
            echo "::error::4回試行しても push できませんでした。コミットが失われています。"
            return 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notebooklm_docs data/help_docs_index.json data/help_bulletins.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: Zscaler ヘルプドキュメント週次更新 $(date -u '+%Y-%m-%d')"
            push_with_retry
          fi

      # NOTEBOOKLM_STORAGE_STATE_JSON が未設定なら丸ごとスキップされる。
      # その場合は notebooklm_docs/ を手動でアップロードすればよい。
      - name: Sync to NotebookLM
        if: ${{ env.NOTEBOOKLM_STORAGE_STATE_JSON != '' && inputs.sync != 'skip' }}
        env:
          SYNC_MODE: ${{ inputs.sync }}
        run: |
          pip install notebooklm-py
          printf '%s' "$NOTEBOOKLM_STORAGE_STATE_JSON" > "$RUNNER_TEMP/storage_state.json"
          export NOTEBOOKLM_STORAGE_STATE="$RUNNER_TEMP/storage_state.json"
          if [ "$SYNC_MODE" = "dry-run" ]; then
            python scripts/sync_notebooklm.py --dry-run
          else
            python scripts/sync_notebooklm.py
          fi

      - name: Commit sync state
        # schedule 実行では inputs が空になるため、"dry-run/skip でないこと" で判定する
        if: ${{ always() && env.NOTEBOOKLM_STORAGE_STATE_JSON != '' && inputs.sync != 'dry-run' && inputs.sync != 'skip' }}
        run: |
          # push が弾かれるのは、同時刻に走る他のワークフローが先に main を進めた
          # ときで、単に再試行しても永久に通らない。origin/main に rebase してから
          # 試し、4回とも駄目ならステップを失敗させる（握り潰すとコミットが黙って
          # 失われ、次回の同期が全ファイル再アップロードになる）。
          push_with_retry() {
            for i in 1 2 3 4; do
              if git push origin HEAD; then
                return 0
              fi
              echo "push rejected (attempt $i) — rebasing onto origin/main"
              sleep $((2 ** i))
              git fetch origin main || continue
              git rebase origin/main || { git rebase --abort || true; continue; }
            done
            echo "::error::4回試行しても push できませんでした。コミットが失われています。"
            return 1
          }

          git add data/notebooklm_sync_state.json
          if git diff --staged --quiet; then
            echo "No sync state changes"
          else
            git commit -m "chore: NotebookLM 同期状態を更新 $(date -u '+%Y-%m-%d')"
            push_with_retry
          fi

      - name: Notify that manual upload is needed
        if: ${{ env.NOTEBOOKLM_STORAGE_STATE_JSON == '' }}
        run: |
          {
            echo "### NotebookLM への取り込み"
            echo
            echo "\`NOTEBOOKLM_STORAGE_STATE_JSON\` secret が未設定のため、同期はスキップしました。"
            echo "更新されたファイルを \`notebooklm_docs/\` から手動でアップロードしてください。"
          } >> "$GITHUB_STEP_SUMMARY"
