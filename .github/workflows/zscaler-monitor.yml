name: Zscaler Release Monitor

on:
  schedule:
    # 毎日 10:00 JST (01:00 UTC) に実行
    # 00:00 UTC は daily-update.yml が走る時刻で、同じ main へ push するため
    # 衝突していた。1時間後ろにずらしている。
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      month_filter:
        description: "対象月 (例: May, June, July)"
        required: false
        default: "May"

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # seen状態ファイルをコミットするために必要

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install playwright beautifulsoup4
          playwright install chromium
          playwright install-deps chromium

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone from secret
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf

      - name: Run Zscaler monitor
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL_FROM:  ${{ secrets.NOTIFY_EMAIL_FROM }}
          MONTH_FILTER:       ${{ github.event.inputs.month_filter || 'May' }}
        run: |
          python scripts/zscaler_monitor.py

      - name: Save seen articles state
        run: |
          # push が弾かれるのは、同時刻に走る他のワークフローが先に main を進めた
          # ときで、単に再試行しても永久に通らない。origin/main に rebase してから
          # 試し、4回とも駄目ならステップを失敗させる（握り潰すと seen 状態が
          # 失われ、同じ記事を翌日また通知してしまう）。
          push_with_retry() {
            for i in 1 2 3 4; do
              if git push origin HEAD; then
                return 0
              fi
              echo "push rejected (attempt $i) — rebasing onto origin/main"
              sleep $((2 ** i))
              git fetch origin main || continue
              git rebase origin/main || { git rebase --abort || true; continue; }
            done
            echo "::error::4回試行しても push できませんでした。コミットが失われています。"
            return 1
          }

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f data/zscaler_seen.json ]; then
            echo "data/zscaler_seen.json がありません。保存をスキップします。"
            exit 0
          fi
          git add data/zscaler_seen.json
          if git diff --staged --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "chore: update zscaler seen articles state"
            push_with_retry
          fi

      - name: Upload debug HTML and notes as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zscaler-output-${{ github.run_number }}
          path: |
            output/debug_page.html
            output/fleeting_notes/
          if-no-files-found: ignore
