name: Philosopher NotebookLM Sync

# 哲学者リソース集の全URLを NotebookLM にウェブソースとして登録する。
# 無料アカウントの上限（1ノートブック50ソース）に合わせ、既定では
# FREE_TIER_GROUPS の4ノートブックへ分けて投入する。
# 追加は冪等（既にあるURLはスキップ）なので何度流しても重複しない。
#
# workflow_dispatch はデフォルトブランチにあるファイルしか起動できないため、
# このワークフローが main にマージされるまでは trigger ファイルへの push で走らせる。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run なら追加せず一覧だけ表示"
        required: false
        type: choice
        options: [apply, dry-run]
        default: dry-run
  push:
    branches:
      - claude/philosopher-resources-collection-xcob5o
    paths:
      - .github/philosopher-notebooklm.trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NOTEBOOKLM_STORAGE_STATE_JSON: ${{ secrets.NOTEBOOKLM_STORAGE_STATE_JSON }}
      # push で起動したときは inputs が空になるので apply を既定にする
      MODE: ${{ inputs.mode || 'apply' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # secrets は step の if: で直接参照できないので job レベルの env 経由で判定する
      - name: Sync URLs to NotebookLM
        if: ${{ env.NOTEBOOKLM_STORAGE_STATE_JSON != '' }}
        run: |
          pip install notebooklm-py
          printf '%s' "$NOTEBOOKLM_STORAGE_STATE_JSON" > "$RUNNER_TEMP/storage_state.json"
          export NOTEBOOKLM_STORAGE_STATE="$RUNNER_TEMP/storage_state.json"
          ARGS="--all-groups"
          if [ "$MODE" = "dry-run" ]; then ARGS="$ARGS --dry-run"; fi
          python scripts/sync_philosopher_notebooklm.py $ARGS 2>&1 | tee sync.log
          {
            echo "## NotebookLM 同期結果 (mode=$MODE)"
            echo '```'
            grep -E '^(===|---|合計|\[account\]|\[notebook\]|\[WARN\]|失敗|  - )' sync.log | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit sync state
        if: ${{ always() && env.NOTEBOOKLM_STORAGE_STATE_JSON != '' && env.MODE == 'apply' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/philosopher_notebooklm_sync_state.json)" ]; then
            git add data/philosopher_notebooklm_sync_state.json
            git commit -m "chore: 哲学者リソース NotebookLM 同期状態を更新 $(date -u +%Y-%m-%d)"
            git push
          else
            echo "同期状態に変化なし"
          fi

      - name: Notify that manual upload is needed
        if: ${{ env.NOTEBOOKLM_STORAGE_STATE_JSON == '' }}
        run: |
          {
            echo "## NotebookLM 同期はスキップされました"
            echo ""
            echo "\`NOTEBOOKLM_STORAGE_STATE_JSON\` secret が未設定です。"
            echo "設定手順は \`docs/notebooklm-setup.md\` を参照してください。"
            echo ""
            echo "手動で入れる場合は \`data/notebooklm_urls/*.txt\` の URL 行を"
            echo "NotebookLM の「ソースを追加 → ウェブサイト」に貼り付けてください。"
          } >> "$GITHUB_STEP_SUMMARY"
